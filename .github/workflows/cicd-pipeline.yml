name: DevOps Lab CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Source Code
      uses: actions/checkout@v3

    - name: 2. Set up Node.js Environment
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: 3. Build & Test Stage
      run: |
        echo "Running automated build..."
        node -v
        echo "Build Stage Successful!"

    - name: 4. Deployment Simulation Stage
      run: |
        echo "Deploying application to virtual target environment..."
        echo "Verifying application status..."
        echo "Deployment Stage Successful!"
