name: Deploy Static HTML via CI/CD

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Verify HTML File Structure
        run: |
          echo "Checking index.html..."
          test -f index.html && echo "HTML file found successfully!"

      - name: 3. Setup Pages
        uses: actions/configure-pages@v5

      - name: 4. Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 5. Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
